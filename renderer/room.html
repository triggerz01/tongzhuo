<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自习室</title>
<link rel="stylesheet" href="styles.css">
<style>
  body.room{margin:0;height:100vh;overflow:hidden;background:#12161a;color:#E6EAEE;
    font-family:var(--sans);display:flex;flex-direction:column}

  /* 场景：背景层 → 3D 角色层 → 前景桌面层 → UI 层 */
  #scene{position:relative;flex:1;overflow:hidden;background:#1b2026}
  #bg{position:absolute;inset:0;background-size:cover;background-position:center;
      transition:opacity .6s;filter:saturate(.92)}
  #bg.placeholder{
    background:
      radial-gradient(120% 80% at 50% 8%, rgba(255,236,200,.20), transparent 60%),
      linear-gradient(#2b3138 0%, #232a31 46%, #1d232a 46.4%, #171c22 100%);
  }
  #bgTint{position:absolute;inset:0;pointer-events:none;transition:background .4s}
  #bgGrain{position:absolute;inset:0;opacity:.05;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
    background-size:3px 3px}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* 前景桌面：同一张图的底部，盖在角色之上，制造"人在桌子后面"的遮挡 */
  #fg{position:absolute;inset:0;pointer-events:none;background-size:cover;
      background-position:center;display:none}
  /* 前景桌面：挡住腿，站姿也能读成"坐在桌前" */
  #desk{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(#3a3229 0%, #2e2822 14%, #241f1a 100%);
    box-shadow:0 -18px 40px rgba(0,0,0,.45);border-top:1px solid rgba(255,255,255,.07)}
  #deskItems{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none}
  #lampGlow{position:absolute;right:6%;bottom:26%;width:46%;height:60%;pointer-events:none;
    background:radial-gradient(60% 70% at 78% 100%, rgba(255,214,150,.26), transparent 70%)}

  /* 顶部状态条 */
  .topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;
    padding:10px 16px;background:linear-gradient(rgba(10,13,16,.72), rgba(10,13,16,0));
    font-family:var(--mono);font-size:12px;letter-spacing:.04em}
  .topbar .grow{margin-left:auto;display:flex;gap:14px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:11px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
  .badge b{color:#fff;font-weight:600}
  .dot2{width:7px;height:7px;border-radius:50%;background:#6b747c}
  .dot2.on{background:#E4737C;box-shadow:0 0 0 3px rgba(228,115,124,.20)}

  /* 角色台词 */
  #line{position:absolute;left:50%;transform:translateX(-50%);bottom:30%;
    max-width:60%;padding:9px 16px;border-radius:16px;
    background:rgba(16,20,24,.86);border:1px solid rgba(255,255,255,.14);
    font-size:14.5px;line-height:1.6;opacity:0;transition:opacity .4s,transform .4s}
  #line.on{opacity:1}

  /* 底部控制条 */
  .dock{display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:#171c22;border-top:1px solid #262d35;flex-wrap:wrap}
  .dock label{font-size:12px;color:#9aa3ab}
  .dock input[type=number]{width:64px;padding:4px 7px;background:#11151a;color:#E6EAEE;
    border:1px solid #2b333b;font-family:var(--mono);font-size:12px}
  .dock button{background:#1e242b;color:#c9d1d8;border:1px solid #2f3841;
    font-family:var(--mono);font-size:11.5px;padding:6px 12px;cursor:pointer}
  .dock button:hover{color:#fff;border-color:#46525d}
  .dock button.primary{background:#9E1B25;color:#fff;border-color:#9E1B25}
  .dock .grow{margin-left:auto;display:flex;gap:8px}

  /* 画中人：腾讯会议那种角落小窗。画面是感知层推过来的带标注帧，
     不是前端自己开摄像头——Windows 上摄像头基本独占，前端再开一路
     会把检测器饿死。 */
  #pip{position:absolute;right:14px;bottom:14px;width:260px;
       border:1px solid rgba(255,255,255,.18);border-radius:6px;overflow:hidden;
       background:#0d1014;box-shadow:0 6px 22px rgba(0,0,0,.45);z-index:5}
  #pipImg{display:block;width:100%;height:auto;background:#0d1014;min-height:60px}
  #pip .pipBar{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 9px;
       font-family:var(--mono);font-size:10.5px;color:#9aa3ab;
       background:rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.10)}
  #pip .pipBar span{margin-right:auto;letter-spacing:.04em}
  #pip .pipBar button{background:transparent;border:0;color:#9aa3ab;cursor:pointer;
       font-size:15px;line-height:1;padding:0 4px}
  #pip .pipBar button:hover{color:#fff}
  @media (max-width:820px){#pip{width:190px}}

  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;max-width:70%;line-height:1.9;font-size:14px;color:#9aa3ab}
  #hint code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:3px;
    font-family:var(--mono);font-size:12.5px;color:#d7dee4}
  #hint b{color:#E6EAEE}
</style>
</head>
<body class="room">

<div id="scene">
  <div id="bg" class="placeholder"></div>
  <div id="bgTint"></div>
  <div id="bgGrain"></div>
  <canvas id="cv"></canvas>
  <div id="fg"></div>
  <div id="desk"></div>
  <div id="lampGlow"></div>
  <svg id="deskItems" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax meet">
    <!-- 台灯 -->
    <g fill="#15181c">
      <rect x="812" y="150" width="14" height="96" rx="6"/>
      <ellipse cx="819" cy="250" rx="52" ry="11"/>
      <path d="M770,150 L868,150 L845,104 L793,104 Z"/>
    </g>
    <path d="M772,152 L866,152 L960,300 L678,300 Z" fill="rgba(255,214,150,.10)"/>
    <!-- 摊开的书 -->
    <g fill="#1a1e23">
      <path d="M300,258 L470,246 L474,268 L296,280 Z"/>
      <path d="M470,246 L640,258 L644,280 L466,268 Z"/>
      <rect x="466" y="240" width="8" height="30" rx="3" fill="#0f1216"/>
    </g>
    <!-- 杯子 -->
    <g fill="#14181d">
      <rect x="150" y="212" width="52" height="58" rx="9"/>
      <path d="M202,228 q26,4 26,18 q0,14 -26,16" fill="none" stroke="#14181d" stroke-width="9"/>
      <ellipse cx="176" cy="212" rx="26" ry="7" fill="#20262c"/>
    </g>
  </svg>

  <div class="topbar">
    <span class="badge"><span id="camDot2" class="dot2"></span><span id="camText">摄像头未连接</span></span>
    <span class="badge">状态 <b id="stateText">未开始</b></span>
    <div class="grow">
      <span class="badge">专注 <b id="focusText">0</b> 分钟</span>
      <span class="badge">今日 <b id="coinText">0</b> / 30 枚</span>
    </div>
  </div>

  <div id="pip" hidden>
    <img id="pipImg" alt="摄像头画面">
    <div class="pipBar">
      <span id="pipLabel">等待画面…</span>
      <button id="pipClose" title="关闭画中人">×</button>
    </div>
  </div>

  <div id="line"></div>

  <div id="hint">
    还没有找到角色模型。<br>
    请在 VRoid Studio 里把工程导出为 <b>VRM</b>，放到<br>
    <code>tongzhuo/assets/models/</code><br>
    然后点下面的「重新加载模型」。
  </div>
</div>

<div class="dock">
  <label>时长</label><input type="number" id="fMin" value="25" min="1" max="240">
  <label>休息</label><input type="number" id="fBreak" value="5" min="0" max="60">
  <button id="btnStart" class="primary">开始自习</button>
  <button id="btnStop">结束</button>
  <div class="grow">
    <button id="btnReload">重新加载模型</button>
    <button id="btnScene">切换场景</button>
    <button id="btnPip">画中人</button>
    <button id="btnPose">测试动作</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "../node_modules/three/build/three.module.js",
    "three/addons/": "../node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
  }
}
</script>
<script type="module" src="room.js"></script>
</body>
</html>
